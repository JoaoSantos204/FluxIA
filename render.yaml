services:
  - type: web
    name: fluxia-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: fluxia-db
          property: connectionString
    autoDeploy: true

databases:
  - name: fluxia-db
    databaseName: fluxia
    user: fluxia_user
    plan: free

